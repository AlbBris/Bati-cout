name: BatiCoût V1.3 loader

on:
  push:
    paths:
      - '.github/workflows/baticout-v13-upgrade.yml'

permissions:
  contents: write

jobs:
  upgrade:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Enable V1.3
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          if 'v1_3_patch.js' not in s:
              s=s.replace('<script src="app.js"></script>', '<script src="app.js"></script>\n  <script src="v1_3_patch.js"></script>')
          p.write_text(s,encoding='utf-8')
          p=Path('sw.js')
          s=p.read_text(encoding='utf-8')
          s=s.replace('baticout-v1.2.1','baticout-v1.3.0').replace('baticout-v1.2.0','baticout-v1.3.0')
          if 'v1_3_patch.js' not in s:
              s=s.replace('"./app.js",','"./app.js","./v1_3_patch.js",')
          p.write_text(s,encoding='utf-8')
          PY
          grep -q 'v1_3_patch.js' index.html
          grep -q 'baticout-v1.3.0' sw.js
      - name: Commit
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html sw.js
          git commit -m "Enable Bati'Coût V1.3 features"
          git push
