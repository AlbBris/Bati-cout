name: Bati'Coût V1.3 upgrade

on:
  push:
    paths:
      - '.github/workflows/baticout-v13-upgrade.yml'

permissions:
  contents: write

jobs:
  upgrade:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply V1.3 patch
        shell: bash
        run: |
          cat > /tmp/v13.patch.gz.b64 <<'EOF'

EOF
          base64 -d /tmp/v13.patch.gz.b64 | gunzip > /tmp/v13.patch
          patch -p2 --batch < /tmp/v13.patch
          sed -i 's/const CACHE="baticout-v1.2.1";/const CACHE="baticout-v1.3.0";/' sw.js
          node --check app.js
          grep -q 'timeCrewCount' index.html
          grep -q 'create or replace function public.delete_project' migration_v1_3.sql

      - name: Commit upgrade
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add README.md app.js index.html styles.css setup.sql migration_v1_3.sql sw.js
          if git diff --cached --quiet; then
            echo 'No changes to commit.'
            exit 0
          fi
          git commit -m "Bati'Coût V1.3: project deletion and team hours"
          git push
