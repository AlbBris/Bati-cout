name: Bati'Coût V1.3.1 cache fix

on:
  push:
    paths:
      - '.github/workflows/baticout-v131-cache-fix.yml'

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Make V1.3 visible and bust stale PWA cache
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          s = s.replace('<div class="hero-badge" id="heroBadge">V1.2</div>', '<div class="hero-badge" id="heroBadge">V1.3</div>')

          if 'id="timeCrewCount"' not in s:
              needle = '<label><span>Durée forcée (h)</span><input id="timeDurationOverride" type="number" min="0" step="0.25" placeholder="Calcul auto" /></label>'
              crew = '''<label class="v13-crew-field"><span>Nombre de personnes</span><select id="timeCrewCount" required><option value="1">1 personne</option><option value="2">2 personnes</option><option value="3">3 personnes</option><option value="4">4 personnes</option><option value="5">5 personnes</option></select><small id="timeCrewHint" class="field-hint">Durée × équipe = heures comptabilisées</small></label>\n        '''
              if needle not in s:
                  raise SystemExit('time duration field not found')
              s = s.replace(needle, crew + needle)

          s = s.replace('<script src="app.js"></script>', '<script src="app.js?v=1.3.1"></script>')
          s = s.replace('<script src="v1_3_patch.js"></script>', '<script src="v1_3_patch.js?v=1.3.1"></script>')
          p.write_text(s, encoding='utf-8')
          PY

          cat > sw.js <<'EOF'
          const CACHE="baticout-v1.3.1";
          const SHELL=["./","./index.html","./styles.css","./app.js?v=1.3.1","./v1_3_patch.js?v=1.3.1","./config.js","./manifest.json","./assets/logo-mark.svg","./assets/icon-192.png","./assets/icon-512.png"];

          self.addEventListener("install",event=>{
            event.waitUntil(caches.open(CACHE).then(cache=>cache.addAll(SHELL)).then(()=>self.skipWaiting()));
          });

          self.addEventListener("activate",event=>{
            event.waitUntil(caches.keys().then(keys=>Promise.all(keys.filter(key=>key!==CACHE).map(key=>caches.delete(key)))).then(()=>self.clients.claim()));
          });

          self.addEventListener("fetch",event=>{
            if(event.request.method!=="GET")return;
            const url=new URL(event.request.url);
            if(url.origin!==self.location.origin)return;

            event.respondWith(
              fetch(event.request).then(response=>{
                if(response && response.ok){
                  const copy=response.clone();
                  caches.open(CACHE).then(cache=>cache.put(event.request,copy));
                }
                return response;
              }).catch(async()=>{
                const cached=await caches.match(event.request);
                if(cached)return cached;
                if(event.request.mode==="navigate")return caches.match("./index.html");
                throw new Error("Offline and resource not cached");
              })
            );
          });
          EOF

          grep -q 'id="timeCrewCount"' index.html
          grep -q '>V1.3<' index.html
          grep -q 'baticout-v1.3.1' sw.js

      - name: Commit changes
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html sw.js
          git commit -m "Fix V1.3 visibility and PWA updates"
          git push
