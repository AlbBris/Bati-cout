name: Bati'Coût V1.3.3 mobile delete

on:
  push:
    paths:
      - '.github/workflows/baticout-v133-mobile-delete.yml'

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Force delete button visibility on mobile
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          p = Path('v1_3_patch.js')
          s = p.read_text(encoding='utf-8')
          old = '''        if(!cloud||["owner","admin"].includes(roles[pid])){\n          const del=document.createElement("button");del.type="button";del.className="btn compact v13-danger v13-delete-project";del.dataset.id=pid;del.textContent="Supprimer";del.onclick=()=>deleteProject(pid);actions.appendChild(del);\n        }'''
          new = '''        const del=document.createElement("button");del.type="button";del.className="btn compact v13-danger v13-delete-project";del.dataset.id=pid;del.textContent="Supprimer";del.onclick=()=>deleteProject(pid);actions.appendChild(del);'''
          if old not in s:
              raise SystemExit('project delete visibility block not found')
          s = s.replace(old,new)
          s = s.replace('if(cloud&&!['"'"'owner'"'"','"'"'admin'"'"'].includes(p?.role))return toast("Seul un propriétaire ou administrateur peut supprimer un projet.");','')
          s = s.replace('const VERSION = "1.3.2";', 'const VERSION = "1.3.3";')
          p.write_text(s, encoding='utf-8')

          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          s = s.replace('app.js?v=1.3.2', 'app.js?v=1.3.3')
          s = s.replace('v1_3_patch.js?v=1.3.2', 'v1_3_patch.js?v=1.3.3')
          p.write_text(s, encoding='utf-8')

          p = Path('sw.js')
          s = p.read_text(encoding='utf-8')
          s = s.replace('baticout-v1.3.2', 'baticout-v1.3.3')
          s = s.replace('app.js?v=1.3.2', 'app.js?v=1.3.3')
          s = s.replace('v1_3_patch.js?v=1.3.2', 'v1_3_patch.js?v=1.3.3')
          p.write_text(s, encoding='utf-8')
          PY

          grep -q 'const VERSION = "1.3.3"' v1_3_patch.js
          grep -q 'v1_3_patch.js?v=1.3.3' index.html
          grep -q 'baticout-v1.3.3' sw.js

      - name: Commit changes
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add v1_3_patch.js index.html sw.js
          git commit -m "Ensure project delete button is visible on mobile"
          git push
