name: Bati'Coût V1.3.4 core integration

on:
  push:
    paths:
      - '.github/workflows/baticout-v133-mobile-delete.yml'

permissions:
  contents: write

jobs:
  integrate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Integrate V1.3.4
        run: python3 tools/integrate_v134.py

      - name: Validate JavaScript
        run: |
          node --check app.js
          grep -q '<small>Dépensé</small>' app.js
          grep -q 'delete-project' app.js
          grep -q 'crew_count:crew' app.js
          grep -q 'baticout-v1.3.4' sw.js

      - name: Commit core files
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app.js styles.css index.html sw.js
          git commit -m "Integrate V1.3.4 features into Bati'Coût core"
          git push
